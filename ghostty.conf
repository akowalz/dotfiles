# Ghostty config, also read by cmux for terminal behavior.
# Reload with `cmux reload-config` (or ^A r in cmux).

# dim unfocused panes less than the default 0.7 (1 turns dimming off)
unfocused-split-opacity = 0.8

# colors (a theme bundled with cmux; the prompt and delta use these ANSI colors)
theme = Abernathy

# copy selected text to the system clipboard, so Cmd+V pastes it. The macOS
# default, `true`, copies only to Ghostty's own selection clipboard, which only
# middle-click pastes from. tmux leaves the mouse to Ghostty, so this covers it too.
copy-on-select = clipboard
