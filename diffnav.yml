# diffnav config (gv and gvw in zshrc), linked to ~/.config/diffnav/config.yml.
ui:
  # Unified diffs by default, like delta in gitconfig. s toggles side-by-side while browsing.
  sideBySide: false
  hideHeader: true
  # diffnav only has fixed-color themes, so it can't follow the terminal's colors like delta does
  theme: catppuccin_macchiato
